name: EdgeOne preview pilot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: edgeone-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Prepare static preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p dist
          printf '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>EdgeOne pilot</title><h1>Preview for PR #%s</h1><p>Build %s</p>\n' "$PR_NUMBER" "$GITHUB_SHA" > dist/index.html
          test -s dist/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: edgeone-preview-site
          path: dist/
          if-no-files-found: error
      - name: Publish to EdgeOne Makers
        id: deploy
        if: vars.EDGEONE_PREVIEW_PROJECT != ''
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PAGES_API_REGION: china
          PAGES_SOURCE: skills
          PROJECT: ${{ vars.EDGEONE_PREVIEW_PROJECT }}
        run: |
          test -n "$EDGEONE_API_TOKEN"
          result="$RUNNER_TEMP/edgeone.jsonl"
          if npx --yes edgeone@1.7.7 makers deploy dist -n "$PROJECT" -t "$EDGEONE_API_TOKEN" -e preview --platform skill-codex --json > "$result"; then
            url="$(tail -n 1 "$result" | jq -er 'select(.status == "success") | .url | select(startswith("https://"))')"
          else
            status=$?
            code="$(tail -n 1 "$result" | jq -r '(.errorCode // empty) | tostring | select(test("^[A-Z0-9_.-]{1,60}$"))' 2>/dev/null || true)"
            printf '::error::EdgeOne CLI exited with status %s (%s)\n' "$status" "${code:-no error code}"
            exit "$status"
          fi
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf '[Open preview](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish or update the PR preview comment
        if: steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          marker='<!-- edgeone-makers-preview -->'
          body="$(printf '%s\n[打开 EdgeOne 预览](%s)\n\n提交：%s\n' "$marker" "$PREVIEW_URL" "$HEAD_SHA")"
          comment_id="$(gh api --paginate "$endpoint" | jq -sr --arg marker "$marker" 'flatten | map(select(.user.login == "github-actions[bot]" and (.body | startswith($marker)))) | first | .id // empty')"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" --silent
          else
            gh api --method POST "$endpoint" -f body="$body" --silent
          fi
